<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff5f8">
  <title>{% block title %}A Fairytale Celebration{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="ambient-glow glow-one"></div>
  <div class="ambient-glow glow-two"></div>
  <div class="sparkle-layer" aria-hidden="true"></div>
  <div class="floating-decor decor-hearts" aria-hidden="true">
    <span>♡</span><span>✧</span><span>♡</span><span>✿</span><span>♡</span>
  </div>

  <main class="page-shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
          {% for category, message in messages %}
            <div class="flash-message {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>made with love, magic & a little sparkle</span>
    <span class="footer-star">✧</span>
  </footer>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
