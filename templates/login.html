{% extends "base.html" %}
{% block title %}Host Login · Fairytale Birthday{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card glass-card tilt-card">
    <div class="auth-icon">♕</div>
    <p class="eyebrow">A LITTLE NOTE FOR THE HOST</p>
    <h1 class="script-heading">Welcome back</h1>
    <p class="auth-description">Sign in to peek at the guest list.</p>
    <form method="POST" class="auth-form">
      <label for="password">Admin password</label>
      <input id="password" type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
      <button class="primary-button" type="submit">Open the guestbook <span>✧</span></button>
    </form>
    <a class="text-link" href="{{ url_for('index') }}">← Back to invitation</a>
  </div>
</section>
{% endblock %}
